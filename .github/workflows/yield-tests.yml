name: Yield Regression Tests

on:
  push:
    branches: [main]
    paths:
      - "src/lib/yieldCalc.ts"
      - "src/lib/__tests__/**"
      - "src/data/districtMetrics.ts"
      - "src/hooks/useIntelligenceData.ts"
      - "package.json"
      - "bun.lock"
      - "vitest.config.ts"
      - ".github/workflows/yield-tests.yml"
  pull_request:
    paths:
      - "src/lib/yieldCalc.ts"
      - "src/lib/__tests__/**"
      - "src/data/districtMetrics.ts"
      - "src/hooks/useIntelligenceData.ts"
      - "package.json"
      - "bun.lock"
      - "vitest.config.ts"
      - ".github/workflows/yield-tests.yml"
  workflow_dispatch:

jobs:
  yield-tests:
    name: Yield calc & district consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run yield regression tests with coverage
        run: |
          bunx vitest run \
            src/lib/__tests__/yieldCalc.test.ts \
            src/lib/__tests__/vilaMarianaConsistency.integration.test.ts \
            src/lib/__tests__/districtsYield.parametrized.test.ts \
            --coverage \
            --reporter=verbose

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yield-coverage
          path: coverage/
          retention-days: 14

      - name: Run full test suite
        run: bun run test
